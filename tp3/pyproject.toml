[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-tp3"
version = "0.1.0"
description = "Perceptrones simples y multicapa para SIA"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.scripts]
sia-tp3 = "sia_tp3.validation:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
