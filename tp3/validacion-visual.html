  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;main id=&quot;guia-sia&quot;&gt;
&lt;header&gt;&lt;p class=&quot;intro&quot;&gt;SIA · TP3 · Guía de validación&lt;/p&gt;&lt;h1&gt;Entender el perceptrón, una cuenta a la vez&lt;/h1&gt;&lt;p&gt;Esta guía reúne los gráficos interactivos y su explicación. Empezá por AND y avanzá hacia el ajuste de funciones y XOR. &lt;strong&gt;Aprender significa cambiar los pesos para acercar la salida a la respuesta esperada.&lt;/strong&gt;&lt;/p&gt;&lt;/header&gt;
&lt;nav aria-label=&quot;Contenido&quot;&gt;&lt;a href=&quot;#base&quot;&gt;La neurona&lt;/a&gt;&lt;a href=&quot;#and&quot;&gt;AND&lt;/a&gt;&lt;a href=&quot;#funciones&quot;&gt;Lineal y tanh&lt;/a&gt;&lt;a href=&quot;#xor&quot;&gt;XOR&lt;/a&gt;&lt;a href=&quot;#decisiones&quot;&gt;Decisiones&lt;/a&gt;&lt;/nav&gt;
&lt;section id=&quot;base&quot;&gt;&lt;h2&gt;Antes de empezar: ¿qué calcula una neurona?&lt;/h2&gt;&lt;p&gt;Recibe números de entrada, multiplica cada uno por un peso y suma un bias. Después aplica una función de activación.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;h = w₁x₁ + w₂x₂ + b&lt;br&gt;ŷ = g(h)&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;x₁, x₂:&lt;/strong&gt; los datos que entran.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;w₁, w₂:&lt;/strong&gt; los pesos que se ajustan durante el aprendizaje.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;b:&lt;/strong&gt; el bias, que permite desplazar la respuesta.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;h:&lt;/strong&gt; la suma antes de activar; &lt;strong&gt;ŷ:&lt;/strong&gt; la predicción; &lt;strong&gt;y:&lt;/strong&gt; la respuesta esperada.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Por ejemplo, con entradas (1, 1), pesos (1, 1) y bias −1, obtenemos h = 1 + 1 − 1 = 1. Lo que hacemos con ese 1 depende de la activación.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;and&quot;&gt;&lt;h2&gt;1. AND: aprender es mover una recta&lt;/h2&gt;&lt;p&gt;Usamos −1 para falso y +1 para verdadero. AND debe responder +1 únicamente cuando las dos entradas son +1. En los otros tres casos debe responder −1.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;ŷ = +1 si h ≥ 0&lt;br&gt;ŷ = −1 si h &amp;lt; 0&lt;/div&gt;&lt;p&gt;La recta h = 0 es la frontera: de un lado predice +1 y del otro −1. Los pesos determinan su orientación y el bias permite desplazarla. Los círculos y cuadrados muestran las clases correctas; el fondo muestra la predicción actual.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Probá:&lt;/strong&gt; avanzá con “Siguiente muestra”. El aro marca la muestra que acaba de procesarse. Ocho pasos equivalen a dos recorridos de las cuatro muestras, es decir, dos épocas.&lt;/p&gt;
&lt;div class=&quot;chart-block&quot;&gt;&lt;div id=&quot;sia-and&quot;&gt;
&lt;h3&gt;AND: aprender a separar cuatro puntos&lt;/h3&gt;
&lt;div class=&quot;viz-row text-small&quot;&gt;&lt;span&gt;● Clase +1: ambas entradas verdaderas&lt;/span&gt;&lt;span&gt;■ Clase −1: los otros casos&lt;/span&gt;&lt;/div&gt;
&lt;div data-plot=&quot;and&quot;&gt;&lt;/div&gt;

&lt;h3&gt;¿Por qué se mueve?&lt;/h3&gt;&lt;p&gt;Al principio todos los pesos son cero, por lo que h = 0 y la neurona responde +1 para todo. La primera entrada es (−1, 1), cuya salida correcta es −1. Se equivoca:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;e = y − ŷ = −1 − 1 = −2&lt;br&gt;wᵢ nuevo = wᵢ + η · e · xᵢ&lt;br&gt;b nuevo = b + η · e&lt;/div&gt;&lt;p&gt;η es la tasa de aprendizaje: controla cuánto corregimos en cada paso. Elegimos 0.1 para que las cuentas sean fáciles de seguir.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;w₁ nuevo = 0 + 0.1 · (−2) · (−1) = 0.2&lt;br&gt;w₂ nuevo = 0 + 0.1 · (−2) · 1 = −0.2&lt;br&gt;b nuevo = 0 + 0.1 · (−2) = −0.2&lt;/div&gt;&lt;p&gt;Con esos valores, la misma muestra ahora produce h = −0.6 y se clasifica correctamente. Eso no asegura todavía que los demás puntos estén bien: por eso seguimos recorriendo el conjunto. Si una muestra ya está bien clasificada, e = 0 y no hay cambios.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;funciones&quot;&gt;&lt;h2&gt;2. Lineal y tanh: ajustar una función&lt;/h2&gt;&lt;p&gt;Ahora queremos predecir valores continuos, no solo dos clases. Usamos 50 entradas equiespaciadas entre −1 y 1. En el primer caso el objetivo es y = x; en el segundo es y = tanh(x).&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Lineal: ŷ = wx + b&lt;br&gt;No lineal: ŷ = tanh(wx + b)&lt;/div&gt;&lt;p&gt;Los puntos son las respuestas esperadas; la línea es lo que predice la neurona con los pesos que elegís. &lt;strong&gt;Mové w y b. Después probá w = 1 y b = 0:&lt;/strong&gt; ambas funciones deberían coincidir con sus objetivos.&lt;/p&gt;

&lt;p&gt;En el caso lineal, w cambia la pendiente y b desplaza la recta verticalmente. En tanh, w cambia la inclinación de la transición y b su posición; las salidas permanecen entre −1 y +1. Acá movés los parámetros manualmente: no hay entrenamiento automático.&lt;/p&gt;&lt;h3&gt;¿Cómo medimos si está aprendiendo?&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;MSE = (1/N) ∑ (y − ŷ)²&lt;/div&gt;&lt;p&gt;Para cada muestra calculamos la diferencia entre lo esperado y lo obtenido, la elevamos al cuadrado y después promediamos. El cuadrado evita que errores positivos y negativos se cancelen. Un MSE de cero significa coincidencia exacta sobre esas muestras.&lt;/p&gt;&lt;h3&gt;¿De dónde sale la actualización?&lt;/h3&gt;&lt;p&gt;Para una muestra usamos E = ½(y − ŷ)². Queremos mover los pesos en el sentido que reduce ese error. Al derivar aparece la derivada de la activación:&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;Δw = η · (y − ŷ) · g′(h) · x&lt;br&gt;Δb = η · (y − ŷ) · g′(h)&lt;/div&gt;&lt;p&gt;En el lineal, g′(h) = 1. En tanh, g′(h) = 1 − ŷ². Cerca de −1 o +1 esta derivada es pequeña: la salida cambia poco y los ajustes se achican. A esto lo llamamos saturación.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;xor&quot;&gt;&lt;h2&gt;3. XOR: cambiar la representación&lt;/h2&gt;&lt;p&gt;XOR devuelve +1 cuando las entradas son distintas. En el espacio original las clases están en esquinas opuestas: no podemos separarlas con una sola recta.&lt;/p&gt;&lt;p&gt;Una capa oculta genera nuevas coordenadas para cada entrada. En vez de mirar (x₁, x₂), la salida mira las activaciones (a₁, a₂). &lt;strong&gt;Seleccioná cada entrada para seguirla entre los dos gráficos.&lt;/strong&gt;&lt;/p&gt;

&lt;p&gt;Después de la transformación, una recta sí separa las clases. Los puntos C y D quedan en la misma posición; está bien porque ambos deben dar −1.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;a₁ = tanh(x₁ − x₂ − 1)&lt;br&gt;a₂ = tanh(−x₁ + x₂ − 1)&lt;br&gt;ŷ = tanh(a₁ + a₂ + 1)&lt;/div&gt;&lt;p&gt;Estos pesos fueron elegidos a mano para mostrar que una arquitectura [2, 2, 1] puede representar XOR. La clase final se obtiene mirando el signo de ŷ. Clasificar bien no implica error cuadrático cero: las salidas continuas no son exactamente ±1.&lt;/p&gt;&lt;h3&gt;¿Cómo aprendería esos pesos?&lt;/h3&gt;&lt;p&gt;Primero calculamos las activaciones desde la entrada hasta la salida. Después distribuimos el error hacia atrás con &lt;strong&gt;backpropagation&lt;/strong&gt;, usando la regla de la cadena.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;δ salida = (y − ŷ) · g′(h salida)&lt;br&gt;δ oculta = g′(h oculta) · ∑ (peso hacia siguiente neurona · δ siguiente)&lt;br&gt;Δw = η · δ destino · activación de origen&lt;/div&gt;&lt;p&gt;Calculamos todos los deltas con los pesos de la misma pasada, antes de actualizar. El ejemplo visual muestra la predicción; el cálculo manual del aprendizaje de XOR y la arquitectura [2, 3, 2, 1] siguen siendo los próximos pasos.&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;decisiones&quot;&gt;&lt;h2&gt;Qué elegimos y por qué&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Codificación bipolar y salida +1 en cero:&lt;/strong&gt; respetan la consigna y la formulación bipolar de clase.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AND con η = 0.1 y pesos iniciales nulos:&lt;/strong&gt; permite seguir cuentas sencillas; no es una elección óptima general.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;50 entradas en [−1, 1]:&lt;/strong&gt; concretan el ejemplo de la consigna en un intervalo moderado. Los controles son para explorar, no resultados de entrenamiento.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Tanh con β = 1:&lt;/strong&gt; coincide con la función objetivo y simplifica su derivada.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;XOR con dos neuronas ocultas:&lt;/strong&gt; permite dibujar el espacio transformado en dos dimensiones. Los pesos son manuales y no demuestran convergencia del entrenamiento.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Bias separado y actualización por muestra:&lt;/strong&gt; hacen visible cada término y cada corrección.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;El motor Python ya está implementado y pasó 31 pruebas automáticas y 15 corridas de validación. Esta página conserva los ejemplos didácticos; los resultados reales y sus gráficos están en tp3/docs/resultados-validacion.md. Los ejercicios con datos de fraude y dígitos todavía no se entrenaron.&lt;/p&gt;&lt;p&gt;Material base: clases 10.1, 10.2 y 11, junto con la consigna de TP3. El registro completo está en &lt;code&gt;tp3/docs/decisiones.md&lt;/code&gt; y el desarrollo matemático en &lt;code&gt;tp3/docs/validacion.md&lt;/code&gt;.&lt;/p&gt;&lt;/section&gt;
&lt;/main&gt;
