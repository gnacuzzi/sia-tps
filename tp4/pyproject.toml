[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-tp4"
version = "0.1.0"
description = "Aprendizaje no supervisado para el TP4 de SIA"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sia-tp4-kohonen = "sia_tp4.kohonen_analysis:main"
sia-tp4-kohonen-grid = "sia_tp4.kohonen_grid_experiment:main"
sia-tp4-kohonen-rate = "sia_tp4.kohonen_rate_experiment:main"
sia-tp4-kohonen-rate-schedule = "sia_tp4.kohonen_rate_schedule_experiment:main"
sia-tp4-kohonen-radius = "sia_tp4.kohonen_radius_experiment:main"
sia-tp4-kohonen-epochs = "sia_tp4.kohonen_epoch_experiment:main"
sia-tp4-kohonen-initialization = "sia_tp4.kohonen_initialization_experiment:main"
sia-tp4-kohonen-interpretation = "sia_tp4.kohonen_interpretation:main"
sia-tp4-kohonen-stability = "sia_tp4.kohonen_stability:main"
sia-tp4-kohonen-synthetic = "sia_tp4.kohonen_synthetic:main"
sia-tp4-pca = "sia_tp4.pca_analysis:main"
sia-tp4-oja-rate = "sia_tp4.oja_rate_experiment:main"
sia-tp4-oja-epochs = "sia_tp4.oja_epoch_experiment:main"
sia-tp4-oja = "sia_tp4.oja_analysis:main"
sia-tp4-campaigns = "sia_tp4.campaign_synthesis:main"
sia-tp4-hopfield-letters = "sia_tp4.hopfield_letters:main"
sia-tp4-hopfield-qr = "sia_tp4.hopfield_qr:main"
sia-tp4-hopfield-qr-capacity = "sia_tp4.hopfield_qr_capacity:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
